# Releases Dukoi when a new version lands on main. See docs/releasing.md.
#
# Merge a PR that adds a "## [0.3.0] - <date>" section to CHANGELOG.md, and this
# workflow runs scripts/release.sh 0.3.0: the phone app, the CLI and the site,
# all at that version. A push that doesn't add a new version releases nothing.
name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  # Run it again by hand, for example after fixing a failed release
  workflow_dispatch:

# One release at a time, and never cancel one halfway through
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Find the new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.find.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: find
        name: Read the newest version in CHANGELOG.md
        run: |
          version="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          if [ -z "$version" ]; then
            echo "No version in CHANGELOG.md yet. Nothing to release."
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released. Nothing to do."
          else
            echo "Releasing $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release ${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.version != ''
    # macOS, because the macOS CLI binaries need codesign
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DUKOI_KEYSTORE_PASSWORD: ${{ secrets.DUKOI_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the secrets are set
        run: |
          missing=""
          for name in DUKOI_KEYSTORE_BASE64 DUKOI_KEYSTORE_PASSWORD CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing. See docs/releasing.md."
            exit 1
          fi
        env:
          DUKOI_KEYSTORE_BASE64: ${{ secrets.DUKOI_KEYSTORE_BASE64 }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 37 and xz
        run: |
          command -v xz >/dev/null || brew install xz
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" "platforms;android-37.0" >/dev/null

      - name: Put the release key on disk
        run: |
          echo "$DUKOI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dukoi-release.jks"
          echo "DUKOI_KEYSTORE=$RUNNER_TEMP/dukoi-release.jks" >> "$GITHUB_ENV"
        env:
          DUKOI_KEYSTORE_BASE64: ${{ secrets.DUKOI_KEYSTORE_BASE64 }}

      - name: Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh "${{ needs.version.outputs.version }}"

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/dukoi-release.jks"
